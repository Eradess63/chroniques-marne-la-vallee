# Publie le site sur GitHub Pages à chaque poussée sur main.
#
# Ce qui est publié, c'est dist/ : un seul fichier, styles, scripts et données
# compris. GitHub Pages met ses fichiers en cache dix minutes, et servir des
# modules séparés revenait à livrer un script neuf avec une feuille de style
# périmée, ou l'inverse. Avec un fichier unique, le site est toujours cohérent
# avec lui-même.
#
# Il n'y a plus de relevé planifié non plus : themeparks.wiki autorise le CORS,
# donc le navigateur interroge l'API directement et le dépôt n'a plus besoin de
# lui servir des temps d'attente en conserve.
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      # Le déploiement cherche parfois l'artefact avant que l'API l'ait indexé,
      # et échoue sur un « Found 0 artifact(s) » alors que le téléversement a
      # réussi une fraction de seconde plus tôt. Quelques secondes suffisent.
      - name: Laisser l'artefact s'indexer
        run: sleep 10

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
