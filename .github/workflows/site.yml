# Publie le site sur GitHub Pages à chaque poussée sur main.
#
# Il n'y a plus de relevé planifié : themeparks.wiki autorise le CORS, donc le
# navigateur interroge l'API directement et le site n'a plus besoin que le
# dépôt lui serve des temps d'attente en conserve.
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
